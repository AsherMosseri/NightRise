<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    A part-filled moon, and a checkmark on the open sky that reaches into it.

    The moon is the app: drawMoon() paints the disc in the shadow tone and fills
    a lit lune across it as tonight's list gets done, so a partly lit moon is a
    picture of the mechanic rather than a label for the category. The lune is the
    same geometry sky.js uses — a right semicircle joined to a terminator ellipse
    of x-radius r * |1 - 2 * fill| — drawn here at fill 0.62. Gibbous rather than
    half on purpose: an exact semicircle reads as a shape with a straight edge,
    not as a moon.

    The checkmark sits mostly on the dark sky, and that is the whole reason the
    composition is arranged this way. Measured, the accent blue against each
    field it could lie on:

      dark sky   #0a1030    7.09:1
      unlit half #39457e    3.44:1
      lit lune   #cbb98f    1.36:1

    Blue on the gold is the worst pairing available, not the best — a draft that
    ran the mark across the lit face measured 1.74:1 median with 87% of its
    length under 3:1, and no choice of blue fixes it, because any blue deep
    enough for the gold (7.71:1) collapses to 1.17:1 on the navy. So the mark
    goes where the contrast already is. It runs across the sky at 7:1, and only
    its tip enters the disc, landing in the shadow side rather than the lit one.
    Median along the stroke is 7.09:1, matching the original logo exactly, and no
    point of it — cap edges included — falls below 3.44:1.

    Flat, not tapered. A gradient buys a meteor reading and costs contrast at
    exactly the end where the stroke is thinnest to the eye; on a mark this size
    the trade is not worth making twice.

    Square, with no baked corner radius. Every platform that shows this applies
    its own mask, and a pre-rounded asset gets rounded twice or picks up dark
    corners. The rounding lives in make-icons.mjs for the maskable variant only.

    Stars are deliberately fat. The old ones were r=4 on a 512 canvas, which is
    under half a pixel at 60x60 — the size this is actually looked at.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141c4a" />
      <stop offset="55%" stop-color="#0a1030" />
      <stop offset="100%" stop-color="#05070f" />
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f0dc" />
      <stop offset="100%" stop-color="#cbb98f" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#7d9bff" stop-opacity=".34" />
      <stop offset="100%" stop-color="#7d9bff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />
  <circle cx="322" cy="184" r="159" fill="url(#glow)" />

  <!-- The unlit disc, and it has to be clearly visible. An early attempt drew it
       at #232a52, which vanished into the glow and left the lit lune reading as
       a lopsided blob — no circle for it to be a fraction of, so the whole idea
       went missing. It is the part that is not done yet; it has to be legible or
       the icon says nothing. -->
  <circle cx="322" cy="184" r="106" fill="#39457e" />
  <circle cx="322" cy="184" r="106" fill="none" stroke="#5866a8" stroke-width="3" opacity=".8" />

  <!-- The lit lune at fill 0.62. rx = 106 * |1 - 2(0.62)| = 25. -->
  <path d="M322 78 A106 106 0 0 1 322 290 A25 106 0 0 1 322 78 Z" fill="url(#moon)" />

  <!--
    The checkmark. Thick on purpose: a 3px stroke on a 512 canvas is a sixth of a
    pixel at the 29px this has to survive, and 34 with a round cap is about two.

    The tip stops at 286,272. Not 296,270, which is where it sat first and looks
    identical: at that point the stroke's round cap overhangs the terminator by a
    few pixels onto the lit face, and those few pixels are at 1.36:1. Pulling the
    tip back 10 units puts the entire cap in shadow and takes the weakest point
    of the whole mark to 3.44:1 — the floor for blue on the unlit navy — at a
    cost of about two percent of the overlap. The centreline was clear either
    way; only sweeping the stroke's full covered area finds it.
  -->
  <path d="M118 316 L186 388 L286 272" fill="none" stroke="#7d9bff" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round" />

  <g fill="#eaf0ff">
    <circle cx="96" cy="106" r="10" opacity=".9" />
    <circle cx="150" cy="66" r="6" opacity=".6" />
    <circle cx="440" cy="404" r="7.5" opacity=".55" />
    <circle cx="382" cy="460" r="5.5" opacity=".45" />
  </g>
</svg>
