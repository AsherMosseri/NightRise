<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The moon, part filled. Which is the app: drawMoon() paints the disc in the
    shadow tone and then fills a lit lune across it as tonight's list gets done,
    so a partly lit moon is a picture of the mechanic rather than a label for the
    category. It says progress without a bar chart and night without a tick.

    The lune is the same geometry sky.js uses — a right semicircle joined to a
    terminator ellipse of x-radius r * |1 - 2 * fill| — drawn here at fill 0.72.
    Gibbous rather than half on purpose: an exact semicircle reads as a shape
    with a straight edge, not as a moon.

    0.72 rather than 0.62 for a measured reason, not a taste one: the meteor has
    to fit entirely on the lit side (see below), and at 0.62 the lit field is too
    narrow to hold a full-size one.

    Square, with no baked corner radius. Every platform that shows this applies
    its own mask, and a pre-rounded asset gets rounded twice or picks up dark
    corners. The rounding lives in make-icons.mjs for the maskable variant only.

    Stars are deliberately fat. The old ones were r=4 on a 512 canvas, which is
    under half a pixel at 60x60 — the size this is actually looked at.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141c4a" />
      <stop offset="55%" stop-color="#0a1030" />
      <stop offset="100%" stop-color="#05070f" />
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f0dc" />
      <stop offset="100%" stop-color="#cbb98f" />
    </linearGradient>
    <!--
      Bottom-left to top-right, the direction the meteor travels: deep where it
      entered, hot where the head is.

      The taper is in *value*, not in opacity, and that is the whole point. The
      first draft faded from 50% opacity to near-white, which put its dim end on
      the moon's unlit half and its bright end on the lit lune — each end on the
      one field it could not be seen against. Measured: 1.74:1 median contrast
      along the stroke, 87% of it under 3:1.

      Now the stroke runs deep blue where it lies on the gold (#3f52b5 on the
      lune is 4.98:1) and near-white where it leaves the disc onto the sky
      (7:1 and better). Same picture of a meteor; the gradient now agrees with
      what is behind it instead of fighting it. Median goes to 3.29:1.
    -->
    <linearGradient id="meteor" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3f52b5" stop-opacity="1" />
      <stop offset="55%" stop-color="#6f8bf0" stop-opacity="1" />
      <stop offset="100%" stop-color="#f2f6ff" stop-opacity="1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#7d9bff" stop-opacity=".34" />
      <stop offset="100%" stop-color="#7d9bff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />
  <circle cx="262" cy="248" r="190" fill="url(#glow)" />

  <!-- The unlit disc, and it has to be clearly visible. The first attempt drew
       it at #232a52, which vanished into the glow and left the lit lune reading
       as a lopsided blob — no circle for it to be a fraction of, so the whole
       idea went missing. It is the part that is not done yet; it has to be
       legible or the icon says nothing. -->
  <circle cx="262" cy="248" r="126" fill="#39457e" />
  <circle cx="262" cy="248" r="126" fill="none" stroke="#5866a8" stroke-width="3" opacity=".8" />

  <!-- The lit lune at fill 0.72. rx = 126 * |1 - 2(0.72)| = 55. -->
  <path d="M262 122 A126 126 0 0 1 262 374 A55 126 0 0 1 262 122 Z" fill="url(#moon)" />

  <!--
    A meteor flying the path of a checkmark, across the moon.

    Both halves of that are load-bearing. It is a meteor because js/main.js:161
    fires shootingStar() on every check-off, so this is the app's own way of
    saying "done" rather than the generic one — and because a meteor can fade
    out at the tail, which is what stops it reading as a stock tick lifted off
    any other to-do app. It is a checkmark because that is the shape a person
    recognises in the third of a second an icon gets.

    It crosses the moon, and that is the whole point of the arrangement. An
    earlier draft put the meteor up in the corner, clear of everything; it
    disappeared into the composition and became a third tier of background,
    sitting with the stars. Overlapping the main element is what forces the eye
    to read something as a second subject rather than as scenery.

    Thick on purpose. A 3px stroke on a 512 canvas is a sixth of a pixel at the
    29px this has to survive; 29 with a round cap is about 1.6, which is the
    floor for a thing meant to be seen at all.

    Every point of it lies on the lit lune or on the open sky, and none of it on
    the moon's unlit half. That is a hard constraint, not a preference. There is
    no blue that works on both fields: the accent gets 3.44:1 on the unlit navy
    but 1.36:1 on the gold, and a blue deep enough for the gold (7.71:1) drops to
    1.17:1 on the navy. A stroke that straddles the terminator therefore has to
    be illegible along part of its length whatever colour it is picked in, so it
    does not straddle it. It enters on the gold and leaves over the sky, and the
    gradient above changes value to suit each.
  -->
  <g>
    <path d="M232 258 L282 324 L404 158" stroke="url(#meteor)" stroke-width="29"
          stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="404" cy="158" r="27" fill="#dfe8ff" opacity=".2" />
    <circle cx="404" cy="158" r="14" fill="#f6f9ff" />
  </g>

  <g fill="#eaf0ff">
    <circle cx="96" cy="106" r="11" opacity=".95" />
    <circle cx="70" cy="196" r="6.5" opacity=".55" />
    <circle cx="430" cy="418" r="8" opacity=".6" />
    <circle cx="366" cy="462" r="6" opacity=".45" />
  </g>
</svg>
