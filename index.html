<!doctype html>
<html lang="en" data-theme="midnight" data-font="aurora" data-motion="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NightCheck — your night, checked off</title>
  <meta name="description" content="A night-themed checklist game: sections, XP, streaks, stardust and a sky that fills up as you finish your night." />
  <meta name="theme-color" content="#0a0d1f" />
  <meta name="color-scheme" content="dark" />
  <!-- iOS only honours the manifest's `display` from 15.4; before that the
       home-screen icon opens in Safari with full browser chrome. The
       black-translucent status bar is what layout.css's safe-area padding
       already assumes. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NightCheck" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/themes.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div id="dim-veil" aria-hidden="true"></div>

  <a class="skip-link" href="#sections">Skip to your checklist</a>

  <header class="topbar">
    <div class="topbar__brand">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <path d="M23.5 20.2A9 9 0 0 1 11.8 8.5a9 9 0 1 0 11.7 11.7z" fill="currentColor" />
        <circle cx="24" cy="8" r="1.6" fill="currentColor" opacity=".8" />
        <circle cx="27.5" cy="13" r="1" fill="currentColor" opacity=".6" />
      </svg>
      <span class="brand__name">Night<span>Check</span></span>
    </div>

    <div id="topstats" class="topbar__stats"></div>

    <!-- Icons are injected from js/dom.js at boot so every icon in the app comes
         from one source and stays the same size. -->
    <nav class="topbar__actions" aria-label="Panels">
      <button type="button" class="icon-btn" data-icon="bag" data-open="shop" title="Night Market (B)" aria-label="Open the Night Market"></button>
      <button type="button" class="icon-btn" data-icon="map" data-open="starmap" title="Star Map (G)" aria-label="Open the Star Map"></button>
      <button type="button" class="icon-btn" data-icon="calendar" data-open="history" title="Night History (H)" aria-label="Open Night History"></button>
      <button type="button" class="icon-btn" data-icon="chart" data-open="insights" title="Insights (I)" aria-label="Open insights"></button>
      <span class="topbar__divider" aria-hidden="true"></span>
      <button type="button" class="icon-btn" id="toggle-sound" aria-pressed="false" title="Sounds are off" aria-label="Toggle sound effects"></button>
      <button type="button" class="icon-btn" data-icon="bulb" id="toggle-dim" aria-pressed="false" title="Sleep-safe dim is off" aria-label="Toggle sleep-safe dim"></button>
      <button type="button" class="icon-btn" data-icon="keyboard" data-open="help" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts"></button>
      <button type="button" class="icon-btn" data-icon="gear" data-open="settings" title="Settings (,)" aria-label="Settings"></button>
    </nav>
  </header>

  <main class="app">
    <section id="tonight" class="tonight" aria-label="Tonight"></section>

    <div class="quick-add">
      <label class="visually-hidden" for="quick-add-input">Quick add a task</label>
      <input id="quick-add-input" type="text" maxlength="200" autocomplete="off" spellcheck="false"
             placeholder="Add something to tonight…" />
      <button id="quick-add-button" type="button" class="btn btn--primary">Add</button>
    </div>
    <button id="quick-add-tap" type="button" class="quick-add-tap" data-icon="plus">
      <span>Add a task</span>
    </button>

    <div id="sections" tabindex="-1" class="sections"></div>
    <div id="nightend"></div>
  </main>

  <div id="companion" class="companion-slot" hidden></div>
  <div id="cards" class="onecard"></div>
  <div id="goodnight" class="goodnight"></div>
  <div id="sheet" class="sheet-host"></div>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

  <dialog id="modal" class="modal" aria-labelledby="modal-title">
    <div class="modal__head">
      <h2 id="modal-title" data-modal-title>Panel</h2>
      <button type="button" class="icon-btn" data-icon="close" data-modal-close aria-label="Close"></button>
    </div>
    <div class="modal__body" data-modal-body></div>
    <div id="toasts-modal" class="toasts toasts--in-modal" aria-live="polite"></div>
  </dialog>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
