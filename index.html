<!doctype html>
<html lang="en" data-theme="midnight" data-font="aurora" data-motion="on">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NightCheck — your night, checked off</title>
  <meta name="description" content="A night-themed checklist game: sections, XP, streaks, stardust and a sky that fills up as you finish your night." />
  <meta name="theme-color" content="#0a0d1f" />
  <meta name="color-scheme" content="dark" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/themes.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div id="dim-veil" aria-hidden="true"></div>

  <a class="skip-link" href="#sections">Skip to your checklist</a>

  <header class="topbar">
    <div class="topbar__brand">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <path d="M23.5 20.2A9 9 0 0 1 11.8 8.5a9 9 0 1 0 11.7 11.7z" fill="currentColor" />
        <circle cx="24" cy="8" r="1.6" fill="currentColor" opacity=".8" />
        <circle cx="27.5" cy="13" r="1" fill="currentColor" opacity=".6" />
      </svg>
      <span class="brand__name">Night<span>Check</span></span>
    </div>

    <div id="topstats" class="topbar__stats"></div>

    <nav class="topbar__actions" aria-label="Panels">
      <button type="button" class="icon-btn" data-open="shop" title="Night Market (B)" aria-label="Open the Night Market">
        <svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8zM9 8V6a3 3 0 0 1 6 0v2" /></svg>
      </button>
      <button type="button" class="icon-btn" data-open="starmap" title="Star map (G)" aria-label="Open the star map">
        <svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4zM9 4v13M15 6.5v13" /></svg>
      </button>
      <button type="button" class="icon-btn" data-open="history" title="Night history (H)" aria-label="Open night history">
        <svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4" /></svg>
      </button>
      <button type="button" class="icon-btn" data-open="insights" title="Insights (I)" aria-label="Open insights">
        <svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7" /></svg>
      </button>
      <span class="topbar__divider" aria-hidden="true"></span>
      <button type="button" class="icon-btn" id="toggle-sound" aria-pressed="false" title="Sounds are off" aria-label="Toggle sound effects">
        <svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 10v4h3l4 4V6L8 10H5zM16 10l4 4M20 10l-4 4" /></svg>
      </button>
      <button type="button" class="icon-btn" id="toggle-dim" aria-pressed="false" title="Sleep-safe dim is off" aria-label="Toggle sleep-safe dim">
        <svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z" /></svg>
      </button>
      <button type="button" class="icon-btn" data-open="help" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">
        <svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v10H3zM7 11h.01M11 11h.01M15 11h.01M7 14h10" /></svg>
      </button>
      <button type="button" class="icon-btn" data-open="settings" title="Settings (,)" aria-label="Settings">
        <svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 12l-1.6-1.2 1.4-2.4 1.9.6 1.7-1L8.3 6h2.8l.4 2 1.7 1 1.9-.6 1.4 2.4L14.9 12l1.6 1.2-1.4 2.4-1.9-.6-1.7 1-.4 2H8.3l-.4-2-1.7-1-1.9.6-1.4-2.4z" /></svg>
      </button>
    </nav>
  </header>

  <main class="app">
    <section id="tonight" class="tonight" aria-label="Tonight"></section>

    <div class="quick-add">
      <label class="visually-hidden" for="quick-add-input">Quick add a task</label>
      <input id="quick-add-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="Add anything…  try  Floss #wind-down !2" />
      <button id="quick-add-button" type="button" class="btn btn--primary">Add</button>
    </div>

    <div id="sections" class="sections"></div>
  </main>

  <div id="companion" class="companion-slot" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

  <dialog id="modal" class="modal">
    <div class="modal__head">
      <h2 data-modal-title>Panel</h2>
      <button type="button" class="icon-btn" data-modal-close aria-label="Close">
        <svg viewBox="0 0 24 24" class="icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>
    <div class="modal__body" data-modal-body></div>
  </dialog>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
